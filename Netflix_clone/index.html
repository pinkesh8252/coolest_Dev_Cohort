<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix_clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar_brand">
            <img src="https://upload.wikimedia.org/wikipedia/commons/7/7a/Logonetflix.png" alt="Netflix image" class="logo">
        </div>
        <div class="navbar_nav">
            <a href="#" class="nav-link">Home</a>
            <a href="#" class="nav-link">Movies</a>
            <a href="#" class="nav-link">New & Popular</a>
            <a href="#" class="nav-link">My List</a>
        </div>
        <div class="navbar_right">
            <i class="fas fa-search"></i>
            <i class="fas fa-bell"></i>
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png" alt="profile-img" class="profile-img">
        </div>
    </nav>
    <header class="hero">
        <div class="hero-content">
            <h1 class="hero-title">Strangers Things</h1>
            <p class="hero-description">
                when a young boy vanishe, a small twon uncovers a involving 
                secret experiments, terrifying supernatural forces and one strange little girl.
            </p>
            <div class="hero-button">
                <button class="btn btn-play"><i class="fa fa-play"></i>Play</button>
                <button class="btn btn-more-info"><i class="fa fa-info-circle"></i>More info</button>
            </div>
        </div>
    </header>
</body>
</html>
