<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- new styling -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="reset.css">
</head>
<body>
    <header>
        <div class="titlebar">
            <img src="./VLC.png" alt="vlc logo" class="img-title">
            <h1 class="title-text">VLC MEDIA PLAYER</h1>
        </div>
        <div class="menu-bar">
            <div class="menu">
                <div class="menu-btn" id="videoBtn">Open</div>
                <input type="file" class="videoInput" id="videoInput">
            </div>
            <div class="menu">
                <div class="menu-btn">Playback</div>
                <ul class="menu-items">
                    <li id="SpeedUp">SpeedUp</li>
                    <li id="SpeedDown">SpeedDown</li>
                </ul>
            </div>
            <div class="menu">
                <div class="menu-btn">Audio</div>
                <ul class="menu-items">
                    <li id="VolumeUp">VolumeUp</li>
                    <li id="VolumeDown">VolumeDown</li>
                </ul>
            </div>
        </div>
    </header>
    <main id="main"></main>
    <div class="toast"></div>
    <footer>
        <i class="fa-solid fa-play"></i>
        <i class="fa-solid fa-pause"></i>
        <i class="fa-solid fa-expand" id="fullscreen"></i>
    </footer>
</body>
<script src="script.js"></script>
</html>
