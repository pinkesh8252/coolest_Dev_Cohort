<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- new styling -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="reset.css">
</head>
<body>
    <header>
        <div class="titlebar">
            <img src="./VLC.png" alt="vlc logo" class="img-title">
            <h1 class="title-text">VLC MEDIA PLAYER</h1>
        </div>
        <div class="menu-bar">
            <div class="menu">
                <div class="menu-btn">Open</div>
            </div>
            <div class="menu">
                <div class="menu-btn">Playback</div>
                <ul class="menu-items">
                    <li id="SpeedUp">SpeedUp</li>
                    <li id="SpeedDown">SpeedDown</li>
                </ul>
            </div>
            <div class="menu">
                <div class="menu-btn">Audio</div>
                <ul class="menu-items">
                    <li id="VolumeUp">VolumeUp</li>
                    <li id="VolumeDown">Volume Down</li>
                </ul>
            </div>
        </div>
    </header>
    <main></main>
    <footer></footer>
